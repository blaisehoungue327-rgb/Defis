<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Profile card component</title>
</head>
<body>
  <main>
    <div class="card-1">
    <img src="./images/bg-pattern-card.svg" alt=" pattern " class="pattern-card">
    </div>
    <div class="card-2">
      <img src="./images/image-victor.jpg" alt="Victor Crest" class="profile-img">
      <div class="description">
        <strong class="name">Victor Crest</strong>
        <p class="age">26</p> 
      </div>
      <p class="location">London</p>
      <div class="stats">
        <div class="stat">
          <strong class="number">80K</strong>
          <p class="label">Followers</p>
        </div>
        <div class="stat">
          <strong class="number">803K</strong>
          <p class="label">Likes</p>
        </div>
        <div class="stat">
          <strong class="number">1.4K</strong>
          <p class="label">Photos</p>
        </div>
      </div>
    </div>
    
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
  </footer>
  </footer>
</body>
</html>
